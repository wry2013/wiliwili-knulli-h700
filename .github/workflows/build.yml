name: Build wiliwili for Knulli H700

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential cmake meson ninja-build \
          wget git pkg-config python3 \
          nasm yasm \
          libssl-dev

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: aarch64-buildroot-linux-gnu_sdk-buildroot
        key: toolchain-knulli-h700-rg35xx-plush-sdk-20240421

    - name: Install Knulli H700 toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: make toolchain

    - name: Inspect sysroot
      run: make check

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: download
        key: downloads-${{ hashFiles('Makefile') }}

    - name: Download sources
      run: make download

    - name: Build dependencies
      shell: bash
      run: |
        set +e
        echo "=== TMPDIR=$TMPDIR ==="
        echo "=== PWD=$PWD ==="
        ls -la download/
        echo "=== Toolchain check ==="
        ls aarch64-buildroot-linux-gnu_sdk-buildroot/.installed && echo "toolchain OK"
        echo "=== Building deps one by one ==="
        for dep in openssl curl webp ass ffmpeg mpv sdl2; do
          echo ""
          echo "====== Building $dep ======"
          make $dep V=1 > /tmp/$dep.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "FAILED: $dep (exit code $RC)"
            echo "===== Last 60 lines of $dep.log ====="
            tail -60 /tmp/$dep.log
            exit $RC
          else
            echo "OK: $dep"
            tail -5 /tmp/$dep.log
          fi
        done
        echo "=== All dependencies built ==="

    - name: Build wiliwili
      run: make wiliwili

    - name: Package PortMaster port
      run: make pkg

    - name: List package contents
      run: |
        echo "=== Package structure ==="
        find pkg/ -type f | head -50
        echo ""
        echo "=== Binary info ==="
        file pkg/wiliwili/wiliwili || true
        ls -lh pkg/wiliwili/wiliwili || true

    - name: Upload PortMaster package
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-knulli-h700
        path: |
          pkg/wiliwili.sh
          pkg/wiliwili/
        retention-days: 90

    - name: Archive build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          /tmp/openssl.log
          /tmp/curl.log
          /tmp/webp.log
          /tmp/ass.log
          /tmp/ffmpeg.log
          /tmp/mpv.log
          /tmp/sdl2.log
          build/ffmpeg/ffbuild/
          build/*/meson-logs/
          build/wiliwili/cmake-build/CMakeFiles/CMakeError.log
          build/wiliwili/cmake-build/CMakeFiles/CMakeOutput.log
        retention-days: 30
