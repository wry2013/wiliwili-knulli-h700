name: Build wiliwili for Knulli H700

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential cmake meson ninja-build \
          wget git pkg-config python3 \
          nasm yasm \
          libssl-dev

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: aarch64-buildroot-linux-gnu_sdk-buildroot
        key: toolchain-knulli-h700-rg35xx-plush-sdk-20240421

    - name: Install Knulli H700 toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: make toolchain

    - name: Inspect sysroot
      run: make check

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: download
        key: downloads-${{ hashFiles('Makefile') }}

    - name: Download sources
      run: make download

    - name: Debug make
      shell: bash
      run: |
        set +e
        echo "=== Files in workspace ==="
        ls -la
        echo "=== Check Makefile line endings ==="
        file Makefile
        cat -A Makefile | head -5
        echo "=== Running make -n openssl ==="
        make -n openssl > /tmp/make_out.txt 2>/tmp/make_err.txt
        EXIT=$?
        echo "EXIT CODE: $EXIT"
        echo "=== STDOUT ==="
        cat /tmp/make_out.txt
        echo "=== STDERR ==="
        cat /tmp/make_err.txt
        echo "=== Emitting stderr as annotations ==="
        while IFS= read -r line; do
          [ -n "$line" ] && echo "::error::$line"
        done < /tmp/make_err.txt
        echo "=== Running make -pn openssl (first 30 lines) ==="
        make -pn openssl 2>&1 | head -30
        exit 0

    - name: Build wiliwili
      if: always()
      shell: bash
      run: |
        set +e
        echo "=== Running make wiliwili ==="
        make wiliwili 2>/tmp/make_wili_err.txt
        EXIT=$?
        echo "EXIT CODE: $EXIT"
        echo "=== STDERR ==="
        cat /tmp/make_wili_err.txt
        head -20 /tmp/make_wili_err.txt | while IFS= read -r line; do
          echo "::error::$line"
        done
        exit 0

    - name: Package PortMaster port
      if: always()
      run: make pkg
