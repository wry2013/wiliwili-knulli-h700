name: Build wiliwili for Knulli H700

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential cmake meson ninja-build \
          wget git pkg-config python3 \
          nasm yasm \
          libssl-dev

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: aarch64-buildroot-linux-gnu_sdk-buildroot
        key: toolchain-knulli-h700-rg35xx-plush-sdk-20240421

    - name: Install Knulli H700 toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: make toolchain

    - name: Inspect sysroot
      run: make check

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: download
        key: downloads-${{ hashFiles('Makefile') }}

    - name: Download sources
      run: make download

    - name: Build dependencies
      shell: bash
      run: |
        set +e
        make deps > /tmp/deps.log 2>&1
        EXIT=$?
        echo "make deps exited with $EXIT"
        tail -60 /tmp/deps.log
        # Only surface annotations on FAILURE. GitHub limits how many error
        # annotations a run keeps; emitting 40 lines on every success would
        # crowd out the real failure from later steps (wiliwili/pkg).
        if [ $EXIT -ne 0 ]; then
          # Extract the REAL failure. GitHub caps error annotations at 10 per step
          # and shows the FIRST ones emitted, so we emit the newest
          # (failure-region) lines FIRST via `tac` (reverse of `tail`).
          DIAG=$(mktemp)
          tail -50 /tmp/deps.log | tac >> "$DIAG"
          for f in build/*/build/meson-logs/meson-log.txt; do
            [ -f "$f" ] && tail -40 "$f" | tac >> "$DIAG"
          done
          if [ ! -s "$DIAG" ]; then
            grep -nE "error:|ERROR:|fatal error|undefined reference|recipe for target|meson.build:[0-9]+: ERROR|configure: error|cannot create executables" /tmp/deps.log >> "$DIAG" 2>/dev/null || true
          fi
          echo "=== Diagnostic (newest first) ==="
          cat "$DIAG"
          awk '!seen[$0]++' "$DIAG" | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
        fi
        exit $EXIT

    - name: Build wiliwili
      shell: bash
      run: |
        set +e
        make wiliwili > /tmp/wiliwili.log 2>&1
        EXIT=$?
        echo "make wiliwili exited with $EXIT"
        tail -60 /tmp/wiliwili.log
        if [ $EXIT -ne 0 ]; then
          DIAG=$(mktemp)
          tail -50 /tmp/wiliwili.log | tac >> "$DIAG"
          for f in build/wiliwili/cmake-build/CMakeFiles/CMakeError.log build/wiliwili/cmake-build/CMakeFiles/CMakeOutput.log; do
            [ -f "$f" ] && tail -40 "$f" | tac >> "$DIAG"
          done
          if [ ! -s "$DIAG" ]; then
            grep -nE "error:|ERROR:|fatal error|undefined reference|recipe for target|CMake Error|could not be found|not found" /tmp/wiliwili.log >> "$DIAG" 2>/dev/null || true
          fi
          echo "=== wiliwili Diagnostic (newest first) ==="
          cat "$DIAG"
          awk '!seen[$0]++' "$DIAG" | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
        fi
        exit $EXIT

    - name: Package PortMaster port
      shell: bash
      run: |
        set +e
        make pkg > /tmp/pkg.log 2>&1
        EXIT=$?
        echo "make pkg exited with $EXIT"
        tail -60 /tmp/pkg.log
        if [ $EXIT -ne 0 ]; then
          DIAG=$(mktemp)
          tail -50 /tmp/pkg.log | tac >> "$DIAG"
          echo "=== pkg Diagnostic (newest first) ==="
          cat "$DIAG"
          awk '!seen[$0]++' "$DIAG" | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
        fi
        exit $EXIT

    - name: List package contents
      run: |
        echo "=== Package structure ==="
        find pkg/ -type f | head -50
        echo ""
        echo "=== Binary info ==="
        file pkg/wiliwili/wiliwili || true
        ls -lh pkg/wiliwili/wiliwili || true

    - name: Upload PortMaster package
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-knulli-h700
        path: |
          pkg/wiliwili.sh
          pkg/wiliwili/
        retention-days: 90

    - name: Archive build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/ffmpeg/ffbuild/
          build/*/meson-logs/
          build/wiliwili/cmake-build/CMakeFiles/CMakeError.log
          build/wiliwili/cmake-build/CMakeFiles/CMakeOutput.log
        retention-days: 30
