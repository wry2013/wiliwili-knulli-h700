name: Build wiliwili for Knulli H700

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential cmake meson ninja-build \
          wget git pkg-config python3 \
          nasm yasm \
          libssl-dev

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: aarch64-buildroot-linux-gnu_sdk-buildroot
        key: toolchain-knulli-h700-rg35xx-plush-sdk-20240421

    - name: Install Knulli H700 toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: make toolchain

    - name: Inspect sysroot
      run: make check

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: download
        key: downloads-${{ hashFiles('Makefile') }}

    - name: Download sources
      run: make download

    - name: Build dependencies
      shell: bash
      run: |
        set +e
        {
          echo "=== STEP START ==="
          echo "PWD=$(pwd)"
          echo "PATH=$PATH"
          echo "--- which make ---"
          which make
          echo "--- make --version ---"
          make --version
          echo "--- ls toolchain ---"
          ls -la aarch64-buildroot-linux-gnu_sdk-buildroot/.installed 2>&1
          echo "--- make -n openssl ---"
          make -n openssl 2>&1
          echo "MAKE_DRY_RUN_EXIT=$?"
          echo "--- make deps (actual build) ---"
          make deps 2>&1
          echo "MAKE_DEPS_EXIT=$?"
          echo "=== STEP END ==="
        } > /tmp/build_deps.log 2>&1
        cat /tmp/build_deps.log
        echo "## Build Dependencies Debug" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat /tmp/build_deps.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Build wiliwili
      if: always()
      shell: bash
      run: |
        set +e
        {
          echo "=== BUILD WILIWILI START ==="
          make wiliwili 2>&1
          echo "MAKE_WILIWILI_EXIT=$?"
          echo "=== BUILD WILIWILI END ==="
        } > /tmp/build_wiliwili.log 2>&1
        cat /tmp/build_wiliwili.log
        echo "## Build wiliwili Debug" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat /tmp/build_wiliwili.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Package PortMaster port
      if: success()
      run: make pkg

    - name: List package contents
      if: success()
      run: |
        echo "=== Package structure ==="
        find pkg/ -type f | head -50
        echo ""
        echo "=== Binary info ==="
        file pkg/wiliwili/wiliwili || true
        ls -lh pkg/wiliwili/wiliwili || true

    - name: Upload PortMaster package
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-knulli-h700
        path: |
          pkg/wiliwili.sh
          pkg/wiliwili/
        retention-days: 90
