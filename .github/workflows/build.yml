name: Build wiliwili for Knulli H700

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential cmake meson ninja-build \
          wget git pkg-config python3 \
          nasm yasm \
          libssl-dev

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: aarch64-buildroot-linux-gnu_sdk-buildroot
        key: toolchain-knulli-h700-rg35xx-plush-sdk-20240421

    - name: Install Knulli H700 toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: make toolchain

    - name: Inspect sysroot
      run: make check

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: download
        key: downloads-${{ hashFiles('Makefile') }}

    - name: Download sources
      run: make download

    - name: Build dependencies
      shell: bash
      run: |
        set +e
        make deps > /tmp/deps.log 2>&1
        EXIT=$?
        echo "make deps exited with $EXIT"
        tail -60 /tmp/deps.log
        # Extract the REAL error lines (ffmpeg 'ERROR:', meson 'ERROR:', compiler
        # errors, etc.) so they survive GitHub's 10-annotation-per-step cap instead
        # of being buried under recipe echoes.
        DIAG=$(mktemp)
        # NOTE: do NOT match "SSL"/"OPENSSL" verbatim — openssl's normal compile
        # command echoes contain OPENSSLDIR and would flood the 10-annotation cap,
        # hiding the real compiler error. Match only actual error markers.
        grep -nE "error:|ERROR:|fatal error|undefined reference|ld: cannot find|recipe for target|make\[[0-9]+\]: \*\*\*|meson.build:[0-9]+:|configure: error|openssl not found|cannot create executables|No such file or directory" /tmp/deps.log >> "$DIAG" 2>/dev/null || true
        for f in build/*/build/meson-logs/meson-log.txt; do
          [ -f "$f" ] && grep -nE "ERROR:|error:|fatal|Unknown option|meson.build:[0-9]+:" "$f" >> "$DIAG" 2>/dev/null || true
        done
        if [ ! -s "$DIAG" ]; then
          echo ">>> No explicit error pattern matched; dumping tail of build log:" >> "$DIAG"
          tail -50 /tmp/deps.log >> "$DIAG"
          for f in build/*/build/meson-logs/meson-log.txt; do [ -f "$f" ] && tail -50 "$f" >> "$DIAG"; done
        fi
        echo "=== Diagnostic lines (real errors first) ==="
        cat "$DIAG"
        sort -u "$DIAG" | head -40 | while IFS= read -r line; do
          [ -n "$line" ] && echo "::error::$line"
        done
        exit $EXIT

    - name: Build wiliwili
      shell: bash
      run: |
        set +e
        make wiliwili > /tmp/wiliwili.log 2>&1
        EXIT=$?
        echo "make wiliwili exited with $EXIT"
        tail -40 /tmp/wiliwili.log
        tail -20 /tmp/wiliwili.log | while IFS= read -r line; do
          [ -n "$line" ] && echo "::error::$line"
        done
        exit $EXIT

    - name: Package PortMaster port
      run: make pkg

    - name: List package contents
      run: |
        echo "=== Package structure ==="
        find pkg/ -type f | head -50
        echo ""
        echo "=== Binary info ==="
        file pkg/wiliwili/wiliwili || true
        ls -lh pkg/wiliwili/wiliwili || true

    - name: Upload PortMaster package
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-knulli-h700
        path: |
          pkg/wiliwili.sh
          pkg/wiliwili/
        retention-days: 90

    - name: Archive build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/ffmpeg/ffbuild/
          build/*/meson-logs/
          build/wiliwili/cmake-build/CMakeFiles/CMakeError.log
          build/wiliwili/cmake-build/CMakeFiles/CMakeOutput.log
        retention-days: 30
